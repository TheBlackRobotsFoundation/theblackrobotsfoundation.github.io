<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <g stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#st)">
    <path d="M260 84 L260 106"/>
    <path d="M260 174 L260 196"/>
    <path d="M260 264 L260 286"/>
  </g>

  <!-- 1 URDF -->
  <rect x="80" y="20" width="360" height="64" rx="2" fill="#141414" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="260" y="48" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">URDF / MJCF</text>
  <text x="260" y="69" text-anchor="middle" fill="#909090" font-size="12">describe el cuerpo del robot</text>

  <!-- 2 MuJoCo -->
  <rect x="80" y="110" width="360" height="64" rx="2" fill="#141414" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="260" y="138" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">MuJoCo</text>
  <text x="260" y="159" text-anchor="middle" fill="#909090" font-size="12">simula su física, paso a paso</text>

  <!-- 3 Gymnasium -->
  <rect x="80" y="200" width="360" height="64" rx="2" fill="#141414" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="260" y="228" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Gymnasium</text>
  <text x="260" y="249" text-anchor="middle" fill="#909090" font-size="12">lo envuelve como entorno · reset / step</text>

  <!-- 4 RL -->
  <rect x="80" y="290" width="360" height="64" rx="2" fill="#1c1c1c" stroke="#6a6a6a" stroke-width="1.5"/>
  <text x="260" y="318" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Aprendizaje por refuerzo · SB3</text>
  <text x="260" y="339" text-anchor="middle" fill="#909090" font-size="12">entrena la política que lo controla</text>
</svg>
