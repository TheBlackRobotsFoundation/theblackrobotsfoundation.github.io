<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- entorno central -->
  <rect x="240" y="106" width="160" height="68" rx="2" fill="#141414" stroke="#5a5a5a" stroke-width="1.5"/>
  <text x="320" y="136" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Entorno</text>
  <text x="320" y="156" text-anchor="middle" fill="#909090" font-size="12">Gymnasium</text>

  <g stroke="#8a8a8a" stroke-width="1.5" fill="none">
    <line x1="240" y1="124" x2="150" y2="60"/>
    <line x1="400" y1="124" x2="490" y2="60"/>
    <line x1="240" y1="156" x2="150" y2="220"/>
    <line x1="400" y1="156" x2="490" y2="220"/>
  </g>

  <!-- 4 preguntas -->
  <g text-anchor="middle">
    <text x="120" y="40" fill="#ffffff" font-size="13">¿Qué veo?</text>
    <text x="120" y="58" fill="#909090" font-size="12" font-style="italic">observación</text>

    <text x="520" y="40" fill="#ffffff" font-size="13">¿Qué puedo hacer?</text>
    <text x="520" y="58" fill="#909090" font-size="12" font-style="italic">acción</text>

    <text x="120" y="238" fill="#ffffff" font-size="13">¿Qué tal lo hice?</text>
    <text x="120" y="256" fill="#909090" font-size="12" font-style="italic">recompensa</text>

    <text x="520" y="238" fill="#ffffff" font-size="13">¿He terminado?</text>
    <text x="520" y="256" fill="#909090" font-size="12" font-style="italic">terminated / truncated</text>
  </g>
</svg>
