<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

<text x="20" y="34" fill="#ffffff" font-size="14" text-anchor="start" font-weight="600">Cada lectura: 40 bits por un solo cable</text>
<rect x="22" y="60" width="236.0" height="46" rx="3" fill="#1c1c1c" stroke="#5fa8d3" stroke-width="2"/>
<text x="140.0" y="88" fill="#5fa8d3" font-size="13" text-anchor="middle" font-weight="600">Humedad</text>
<text x="140.0" y="128" fill="#909090" font-size="11" text-anchor="middle">16 bits</text>
<rect x="262.0" y="60" width="236.0" height="46" rx="3" fill="#1c1c1c" stroke="#e3b341" stroke-width="2"/>
<text x="380.0" y="88" fill="#e3b341" font-size="13" text-anchor="middle" font-weight="600">Temperatura</text>
<text x="380.0" y="128" fill="#909090" font-size="11" text-anchor="middle">16 bits</text>
<rect x="502.0" y="60" width="116.0" height="46" rx="3" fill="#1c1c1c" stroke="#7a7a7a" stroke-width="2"/>
<text x="560.0" y="88" fill="#7a7a7a" font-size="13" text-anchor="middle" font-weight="600">Control</text>
<text x="560.0" y="128" fill="#909090" font-size="11" text-anchor="middle">8 bits</text>
<text x="20" y="170" fill="#909090" font-size="11" text-anchor="start">Ejemplo:</text>
<text x="90" y="170" fill="#5fa8d3" font-size="12" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">652  →  65,2 %</text>
<text x="260" y="170" fill="#e3b341" font-size="12" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">231  →  23,1 °C</text>
<text x="450" y="170" fill="#909090" font-size="11" text-anchor="start">suma de comprobación</text>
<text x="20" y="206" fill="#5a5a5a" font-size="11" text-anchor="start">La librería se encarga de pedir los datos, recibirlos y comprobar que llegan bien.</text>
</svg>
