<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d0d0d0"/>
    </marker>
  </defs>

  <!-- marcos de los 4 paneles -->
  <g fill="none" stroke="#242424" stroke-width="1">
    <rect x="10" y="10" width="290" height="160" rx="2"/>
    <rect x="320" y="10" width="290" height="160" rx="2"/>
    <rect x="10" y="190" width="290" height="160" rx="2"/>
    <rect x="320" y="190" width="290" height="160" rx="2"/>
  </g>

  <!-- FIXED -->
  <text x="28" y="38" fill="#ffffff" font-size="15" font-weight="600">fixed</text>
  <text x="28" y="56" fill="#909090" font-size="12">sin movimiento</text>
  <g transform="translate(90 95)">
    <rect x="-70" y="0" width="60" height="40" rx="2" fill="#141414" stroke="#4a4a4a" stroke-width="1.5"/>
    <rect x="10" y="0" width="60" height="40" rx="2" fill="#141414" stroke="#4a4a4a" stroke-width="1.5"/>
    <line x1="-10" y1="20" x2="10" y2="20" stroke="#8a8a8a" stroke-width="3"/>
  </g>

  <!-- REVOLUTE -->
  <text x="338" y="38" fill="#ffffff" font-size="15" font-weight="600">revolute</text>
  <text x="338" y="56" fill="#909090" font-size="12">gira con límites (un codo)</text>
  <g transform="translate(465 110)">
    <circle cx="0" cy="0" r="4" fill="#d0d0d0"/>
    <rect x="-6" y="-58" width="12" height="52" rx="2" fill="#141414" stroke="#4a4a4a" stroke-width="1.5" transform="rotate(28)"/>
    <path d="M -40 -14 A 42 42 0 0 1 40 -14" fill="none" stroke="#d0d0d0" stroke-width="1.5" marker-start="url(#a2)" marker-end="url(#a2)"/>
  </g>

  <!-- CONTINUOUS -->
  <text x="28" y="218" fill="#ffffff" font-size="15" font-weight="600">continuous</text>
  <text x="28" y="236" fill="#909090" font-size="12">gira sin fin (una rueda)</text>
  <g transform="translate(120 295)">
    <circle cx="0" cy="0" r="34" fill="#141414" stroke="#4a4a4a" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#d0d0d0"/>
    <path d="M 0 -50 A 50 50 0 1 1 -50 0" fill="none" stroke="#d0d0d0" stroke-width="1.5" marker-end="url(#a2)"/>
  </g>

  <!-- PRISMATIC -->
  <text x="338" y="218" fill="#ffffff" font-size="15" font-weight="600">prismatic</text>
  <text x="338" y="236" fill="#909090" font-size="12">se desliza en línea recta</text>
  <g transform="translate(465 285)">
    <rect x="-80" y="14" width="160" height="10" rx="2" fill="#0f0f0f" stroke="#333" stroke-width="1"/>
    <rect x="-26" y="-6" width="52" height="34" rx="2" fill="#141414" stroke="#4a4a4a" stroke-width="1.5"/>
    <line x1="-70" y1="48" x2="70" y2="48" stroke="#d0d0d0" stroke-width="1.5" marker-start="url(#a2)" marker-end="url(#a2)"/>
  </g>
</svg>
